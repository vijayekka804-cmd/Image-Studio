name: Build Signed Android App Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-aab:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36.1
        shell: bash
        run: |
          sdkmanager             "platforms;android-36.1"             "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Decode upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-upload-key.jks"

          if [ ! -s "$RUNNER_TEMP/my-upload-key.jks" ]; then
            echo "Decoded keystore is empty or invalid."
            exit 1
          fi

          echo "Keystore decoded successfully."

      - name: Build signed release bundle
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle             --no-daemon             --stacktrace             --no-configuration-cache             :app:bundleRelease

      - name: Verify and rename AAB
        id: bundle
        shell: bash
        run: |
          AAB_PATH="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"

          if [ -z "$AAB_PATH" ] || [ ! -f "$AAB_PATH" ]; then
            echo "Release AAB was not found."
            find app/build/outputs -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi

          OUTPUT_NAME="CG-Job-Alert-v2.0-build-${GITHUB_RUN_NUMBER}.aab"
          cp "$AAB_PATH" "$OUTPUT_NAME"

          jarsigner -verify "$OUTPUT_NAME"

          echo "aab_path=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"
          echo "Signed AAB ready: $OUTPUT_NAME"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: CG-Job-Alert-Signed-AAB
          path: ${{ steps.bundle.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30
